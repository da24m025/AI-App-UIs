global:
  scrape_interval: 15s

scrape_configs:

  - job_name: 'backend'
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['backend:5001']

  - job_name: 'frontend'
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['frontend:3000']
